name: Test LeetCode Solutions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up C++
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ build-essential

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Python syntax
        run: |
          echo "Checking Python files..."
          files=$(find Leetcode/PythonAnswers -name "*.py")
          if [ -z "$files" ]; then
            echo "No Python files found"
            exit 0
          fi
          for file in $files; do
            echo "Checking $file..."
            python -m py_compile "$file"
          done
          echo "✓ Python check complete!"

      - name: Compile Java files
        run: |
          echo "Compiling Java files..."
          files=$(find Leetcode/Java -name "*.java")
          if [ -z "$files" ]; then
            echo "No Java files found"
            exit 0
          fi
          for file in $files; do
            echo "Compiling $file..."
            javac "$file"
          done

          echo "✓ Java check complete!"

      - name: Compile C++ files
        run: |
          echo "Compiling C++ files..."
          files=$(find Leetcode/C++ -name "*.c++")
          if [ -z "$files" ]; then
            echo "No C++ files found"
            exit 0
          fi
          for file in $files; do
            echo "Compiling $file..."
            g++ -std=c++17 -Wall -Wextra -fsyntax-only "$file"
          done
          echo "✓ C++ check complete!"

      - name: Compile Rust files
        run: |
          echo "Compiling Rust files..."
          files=$(find Leetcode/Rust -name "*.rs")
          if [ -z "$files" ]; then
            echo "No Rust files found"
            exit 0
          fi
          for file in $files; do
            echo "Compiling $file..."
            rustc --edition 2021 "$file" -o /tmp/rust_out
          done
          echo "✓ Rust check complete!"

      - name: Generate README
        run: |
          python scripts/generate_readme.py

      - name: Check if README changed
        id: readme_check
        run: |
          git diff --exit-code README.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated README
        if: steps.readme_check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "Auto-update README with solved problems"
          git push